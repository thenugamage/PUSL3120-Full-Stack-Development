version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: sudu-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sudu-backend
    restart: always
    # Load env from your backend .env (for PORT etc.)
    env_file:
      - ./backend/.env
    # But override MONGO_URI so inside container it talks to "mongo" service
    environment:
      - MONGO_URI=mongodb://mongo:27017/sudu_araliya_db
    depends_on:
      - mongo
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sudu-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  mongo_data:
